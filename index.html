<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b0d10">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon-512.png">
<link rel="apple-touch-icon" href="/icon-512.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>tvapp - live channels</title>
<style>
  :root{
    --bg:#070a0e; --panel:#0d1218; --panel2:#131a22; --panel3:#182028;
    --line:#1c2632; --line2:#26333f;
    --txt:#e8eef6; --dim:#8fa0b4; --dim2:#5f7284;
    --acc:#4cc2ff; --ok:#3ddc84; --warn:#ffb02e; --bad:#ff6b6b; --live:#ff4d4d;
    --chw:212px;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--txt);font:14px/1.45 "Segoe UI Variable","Segoe UI",system-ui,sans-serif;
    display:flex;overflow:hidden;-webkit-font-smoothing:antialiased}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:#233040;border-radius:6px;border:2px solid var(--bg)}
  ::-webkit-scrollbar-thumb:hover{background:#2e4053}
  ::-webkit-scrollbar-track{background:transparent}

  /* ---------------------------------------------------------------- sidebar */
  #rail{width:324px;flex:0 0 324px;background:linear-gradient(180deg,#0d1218,#0a0f14);
    border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
  .brand{padding:16px 16px 12px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 12px var(--acc)}
  .brand b{font-size:15px;letter-spacing:.6px;text-transform:lowercase}
  .brand span{color:var(--dim2);font-size:11px;margin-left:auto;font-variant-numeric:tabular-nums}
  .tools{padding:10px 12px;display:flex;gap:6px;border-bottom:1px solid var(--line);align-items:center}
  .tools input{flex:1}
  input[type=search],input[type=text]{
    background:var(--panel2);border:1px solid var(--line);color:var(--txt);
    border-radius:9px;padding:8px 11px;font-size:12.5px;outline:none;width:100%;transition:.15s}
  input[type=search]:focus,input[type=text]:focus{border-color:#2f6a8a;background:#101821;
    box-shadow:0 0 0 3px rgba(76,194,255,.08)}
  input::placeholder{color:var(--dim2)}
  button{background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:9px;
    padding:7px 11px;font-size:12px;cursor:pointer;white-space:nowrap;transition:.15s;font-weight:500}
  button:hover{border-color:var(--line2);background:var(--panel3);color:#fff}
  button:active{transform:translateY(1px)}
  #list{overflow:auto;flex:1;padding:4px 8px 20px}
  .grp{color:var(--dim2);font-size:10px;text-transform:uppercase;letter-spacing:1.4px;font-weight:700;
    padding:14px 8px 7px;display:flex;align-items:center;gap:7px;cursor:pointer;user-select:none}
  .grp:hover{color:var(--dim)}
  .grp .car{width:8px;font-size:9px;opacity:.7}
  .grp .cnt{margin-left:auto;background:#141d26;border:1px solid var(--line);border-radius:20px;
    padding:1px 7px;font-size:9.5px;letter-spacing:0;color:var(--dim)}
  .ch{display:flex;align-items:center;gap:10px;padding:8px 9px;border-radius:10px;cursor:pointer;
    border:1px solid transparent;transition:background .12s,border-color .12s;position:relative}
  .ch:hover{background:var(--panel2)}
  .ch.active{background:#111c25;border-color:#1f3b4d}
  .ch.active:before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:2px;border-radius:2px;background:var(--acc)}
  .ch .slot{position:relative;width:30px;height:30px;flex:0 0 30px;display:flex;align-items:center;justify-content:center}
  .ch .lg{width:30px;height:30px;border-radius:7px;object-fit:contain;background:#0f161d;border:1px solid var(--line)}
  .ch .mono{width:30px;height:30px;border-radius:7px;background:#111a22;border:1px solid var(--line);
    color:var(--dim);font-size:11.5px;font-weight:700;display:flex;align-items:center;justify-content:center}
  .ch .nm{flex:1;min-width:0}
  .ch .nm div:first-child{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ch .nm div:last-child{font-size:10.5px;color:var(--dim2);white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis;font-variant-numeric:tabular-nums;margin-top:1px}
  .badge{font-size:9.5px;font-weight:700;letter-spacing:.4px;padding:2px 6px;border-radius:5px;
    background:#13212c;color:#8fb8cc;min-width:46px;text-align:center;flex:0 0 auto;
    font-variant-numeric:tabular-nums;border:1px solid #1b2c39}
  .st{position:absolute;right:-2px;bottom:-2px;width:7px;height:7px;border-radius:50%;
    background:transparent;border:1px solid transparent}
  .st.ok{background:var(--ok);border-color:#0a1015} .st.bad{background:#7a2620;border-color:#0a1015}
  .st.wait{background:var(--warn);border-color:#0a1015}
  #addbar{display:none;padding:10px 12px;gap:6px;border-bottom:1px solid var(--line);background:var(--panel2)}
  #addbar.show{display:flex}

  /* ---------------------------------------------------------------- player */
  #main{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
  #stage{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(120% 120% at 50% 0%,#0d141b 0%,#05070a 70%)}
  video{width:auto;height:auto;max-width:100%;max-height:100%;object-fit:contain !important;
    object-position:center;background:#000;border-radius:2px;transition:opacity .2s}
  video.idle{opacity:0}
  #stage:fullscreen video{max-width:100%;max-height:100%;object-fit:contain !important}
  video::cue{background:rgba(0,0,0,.66);color:#fff;font-size:20px;line-height:1.32;
    font-family:inherit;text-shadow:0 1px 2px #000}
  #stage:fullscreen video::cue{font-size:30px}
  #overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;
    gap:10px;background:rgba(5,7,10,.86);text-align:center;padding:24px;backdrop-filter:blur(2px)}
  #overlay.show{display:flex}
  #overlay h2{margin:0;font-size:18px;letter-spacing:.2px}
  #overlay p{margin:0;color:var(--dim);max-width:520px;font-size:12.5px}
  #overlay b{color:var(--txt)}

  /* ---------------------------------------------------------------- bottom bar */
  #bar{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--line);
    background:linear-gradient(180deg,#0d1218,#0a0f14);font-size:12px;color:var(--dim);min-width:0}
  #bar b{color:var(--txt);font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis;max-width:30ch}
  #nowProg{color:var(--acc);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:34ch;font-size:12px}
  #nowNote{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1;font-variant-numeric:tabular-nums}
  #meta{margin-left:auto;display:flex;gap:7px;align-items:center;flex:0 0 auto;white-space:nowrap}
  .pill{background:#101820;border:1px solid var(--line);border-radius:7px;padding:4px 8px;
    font-variant-numeric:tabular-nums;font-size:11px;color:var(--dim)}
  .pill.warn{color:var(--warn);border-color:#4a3612;background:#1c1608}
  .pill.bad{color:var(--bad);border-color:#4a1d1d;background:#1c0b0b}
  #qmode{min-width:56px;font-weight:800;letter-spacing:.4px;color:var(--ok);border-color:#22422f;background:#0e1a13}
  #qmode.auto{color:var(--warn);border-color:#4a3612;background:#1c1608}
  #ccBtn{min-width:46px;font-weight:700}
  #ccBtn.on{color:var(--ok);border-color:#22422f;background:#0e1a13}
  #ccBtn:disabled{opacity:.35;cursor:default}
  #guideBtn{font-weight:600}

  /* ---------------------------------------------------------------- guide */
  #guide{position:fixed;inset:0;z-index:50;display:none;flex-direction:column;background:#080c11}
  #guide.show{display:flex}
  #gHead{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,#0e141b,#0a0f14)}
  #gHead b{color:var(--txt);font-size:15px;letter-spacing:.3px}
  #gInfo{color:var(--dim2);font-size:12px}
  #gHead .sp{flex:1}
  #gScroll{overflow:auto;flex:1}
  .epg{position:relative;width:max-content;min-width:100%}
  .erow{display:flex;align-items:stretch;height:52px;border-bottom:1px solid #0f161d}
  .erow:nth-child(even){background:#090e13}
  .erow.grp{height:30px;background:#0c131a;border-bottom:1px solid var(--line);border-top:1px solid var(--line)}
  .erow.grp .ecell{font-size:9.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim2);font-weight:800}
  .ecell{position:sticky;left:0;z-index:3;width:var(--chw);min-width:var(--chw);background:#0b1117;
    border-right:1px solid var(--line);display:flex;align-items:center;gap:9px;padding:0 12px}
  .ecell .glogo{width:26px;height:26px;flex:0 0 26px;border-radius:6px;background:#111a22;border:1px solid var(--line);
    color:var(--dim);font-size:10.5px;font-weight:700;display:flex;align-items:center;justify-content:center}
  .ecell .n{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
  .ecell .b{font-size:9.5px;color:var(--dim2);white-space:nowrap}
  .etrack{position:relative;flex:0 0 auto}
  .etrack .none{position:absolute;left:10px;top:18px;font-size:11px;color:#3f4f5f;font-style:italic}
  .eblock{position:absolute;top:7px;bottom:7px;border-radius:8px;background:#131d27;
    border:1px solid #1b2a37;padding:5px 9px;overflow:hidden;cursor:pointer;color:#cfe0ee;transition:.12s}
  .eblock:hover{background:#19262f;border-color:#2b4256;transform:translateY(-1px)}
  .eblock.now{background:linear-gradient(180deg,#123024,#0e261c);border-color:#256b42;color:#dbffe9}
  .eblock.now:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--ok);border-radius:8px 0 0 8px}
  .eblock .t{font-size:11.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .eblock .s{font-size:10px;color:#7d93a8;margin-top:1px;font-variant-numeric:tabular-nums}
  .eblock.now .s{color:#8fe0ae}
  .ehead{position:sticky;top:0;z-index:5;background:#0b1117;height:34px;border-bottom:1px solid var(--line)}
  .ehead .ecell{z-index:6;font-size:11px;color:var(--dim2);letter-spacing:1.2px;text-transform:uppercase}
  .etick{position:absolute;top:0;height:100%;border-left:1px solid #16202a;color:var(--dim2);
    font-size:10.5px;padding:9px 0 0 6px;white-space:nowrap;font-variant-numeric:tabular-nums}
  .etick.hour{color:var(--dim);border-left-color:#22303d}
  .nowline{position:absolute;top:0;bottom:0;width:2px;background:var(--acc);opacity:.85;z-index:2;
    box-shadow:0 0 10px rgba(76,194,255,.5);pointer-events:none}
  .nowline:before{content:"";position:absolute;top:0;left:-4px;width:10px;height:10px;border-radius:50%;background:var(--acc)}
</style>
</head>
<body>
<div id="rail">
  <div class="brand"><div class="dot"></div><b>tvapp</b><span id="count"></span></div>
  <div class="tools">
    <input id="q" type="search" placeholder="filter channels...">
    <button id="checkAll" title="probe every channel">Check</button>
    <button id="addBtn" title="add a stream URL">+</button>
    <button id="guideTop" title="TV guide (G)">Guide</button>
  </div>
  <div id="addbar">
    <input id="addUrl" type="text" placeholder="https://.../index.m3u8">
    <button id="addGo">Add</button>
  </div>
  <div id="list"></div>
</div>

<div id="main">
  <div id="stage">
    <video id="v" playsinline controls controlslist="nodownload nofullscreen" disablepictureinpicture></video>
    <div id="guide">
      <div id="gHead"><b>TV Guide</b><span id="gInfo"></span><span class="sp"></span>
        <button id="gNow" title="scroll back to now">Now</button>
        <button id="gClose">Close</button></div>
      <div id="gScroll"><div class="epg" id="gList"></div></div>
    </div>
    <div id="overlay"><h2 id="ovTitle">Nothing playing</h2><p id="ovText">Pick a channel on the left — press <b>G</b> for the TV guide.</p><button id="retry">Retry</button></div>
  </div>
  <div id="bar">
    <b id="nowTitle">-</b>
    <span id="nowProg"></span>
    <span id="nowNote"></span>
    <div id="meta">
      <span class="pill" id="mRes">-</span>
      <span class="pill" id="mRate">-</span>
      <span class="pill" id="mAudio" title="audio track codec">-</span>
      <span class="pill" id="mLive">-</span>
      <span class="pill" id="mLat" title="seconds behind the live edge">-</span>
      <button id="ccBtn" title="captions: press C to cycle off / track 1 / track 2">CC</button>
      <button id="guideBtn" title="TV guide (G)">Guide</button>
      <button id="qmode" title="MAX = force the highest variant, AUTO = let ABR adapt">MAX</button>
      <button id="vlc" title="open this stream in VLC (handles HEVC / AC-3 / multi-program TS)">VLC</button>
      <button id="fs">Fullscreen</button>
    </div>
  </div>
</div>

<script src="/hls.min.js"></script>
<script>
const $ = s => document.querySelector(s);
let DATA = { groups: [] }, FLAT = [], CUR = -1, hls = null, tries = 0, custom = [];

const KEY = 'tvapp.custom.v1';
try { custom = JSON.parse(localStorage.getItem(KEY) || '[]'); } catch (e) { custom = []; }

let COLLAPSED = new Set(JSON.parse(localStorage.getItem('tvapp.collapsed') || '[]'));

async function boot(){
  const r = await fetch('/api/channels');
  DATA = await r.json();
  rebuild();
  loadGuide();
  $('#v').classList.add('idle');          // no empty black player box before a channel is picked
  overlay('Nothing playing', 'Pick a channel on the left, or press G for the TV guide.');
  const q = new URLSearchParams(location.search);
  if (q.has('cc')){
    const c = parseInt(q.get('cc'), 10);
    CCSTATE = Number.isFinite(c) ? c : 0;      // ?cc=0 forces the first caption track on
  }
  if (q.has('ch')){
    const i = parseInt(q.get('ch'), 10);
    if (!isNaN(i) && FLAT[i]){ $('#v').muted = true; play(i); }
  }
  if (q.has('guide')) setTimeout(openGuide, 400);
}

function rebuild(){
  FLAT = [];
  const q = ($('#q').value || '').toLowerCase().trim();
  const groups = DATA.groups.map(g => ({ name: g.name, chans: g.channels.filter(c => !q || c.name.toLowerCase().includes(q)) }));
  if (custom.length) groups.push({ name: 'Custom', chans: custom.filter(c => !q || c.name.toLowerCase().includes(q)) });

  const list = $('#list'); list.innerHTML = '';
  groups.forEach(g => {
    if (!g.chans.length) return;
    const collapsed = COLLAPSED.has(g.name) && !q;
    const h = document.createElement('div'); h.className = 'grp';
    h.innerHTML = '<span class="car">' + (collapsed ? '\u25B8' : '\u25BE') + '</span><span>' + g.name +
                  '</span><span class="cnt">' + g.chans.length + '</span>';
    h.onclick = () => {
      if (COLLAPSED.has(g.name)) COLLAPSED.delete(g.name); else COLLAPSED.add(g.name);
      localStorage.setItem('tvapp.collapsed', JSON.stringify([...COLLAPSED]));
      rebuild();
    };
    list.appendChild(h);
    if (collapsed) return;
    g.chans.forEach(c => {
      const i = FLAT.push(c) - 1;
      const el = document.createElement('div'); el.className = 'ch'; el.dataset.i = i;
      const initial = ((c.name.replace(/[^A-Za-z0-9\u4e00-\u9fff]/g, '') || '?')[0] || '?').toUpperCase();
      const mark = '<span class="slot">' +
        (c.logo
          ? '<img class="lg" src="' + c.logo + '" loading="lazy" alt="" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\'">' +
            '<span class="mono" style="display:none">' + initial + '</span>'
          : '<span class="mono">' + initial + '</span>') +
        '<span class="st" data-st="' + i + '"></span></span>';
      const badgeText = (c.badge || c.quality || '')
        .replace(/^live$/i, 'HD').replace(/\s+/g, ' ');
      el.innerHTML = mark + '<div class="nm"><div>' + c.name + '</div><div>' + (c.note || c.url) + '</div></div>' +
        '<span class="badge">' + badgeText + '</span>';
      el.onclick = () => play(i);
      list.appendChild(el);
    });
  });
  $('#count').textContent = FLAT.length + ' ch';
  markActive();
}

function markActive(){
  document.querySelectorAll('.ch').forEach(el => el.classList.toggle('active', +el.dataset.i === CUR));
}
function overlay(title, text){
  $('#ovTitle').textContent = title; $('#ovText').textContent = text || '';
  $('#overlay').classList.add('show');
}
function hideOverlay(){ $('#overlay').classList.remove('show'); }

// ---- quality: always the highest variant, ABR downswitching disabled ----
// hls.js still reports switch attempts; we re-pin on every level change.
let QMODE = 'max';   // press "a" in the player to allow AUTO for one channel

function bestLevel(){
  if (!hls || !hls.levels.length) return -1;
  let bi = 0;
  hls.levels.forEach((l, i) => {
    const a = hls.levels[bi];
    const better = (l.height || 0) > (a.height || 0) ||
                   ((l.height || 0) === (a.height || 0) && (l.bitrate || 0) > (a.bitrate || 0));
    if (better) bi = i;
  });
  return bi;
}
function applyQuality(){
  const b = $('#qmode');
  if (b){ b.textContent = QMODE === 'max' ? 'MAX' : 'AUTO'; b.classList.toggle('auto', QMODE !== 'max'); }
  if (!hls) return;
  const bi = bestLevel();
  if (bi < 0) return;
  if (QMODE === 'max') hls.currentLevel = bi;  // pin the top variant
  else hls.currentLevel = -1;                  // ABR takes over
}

// live-edge distance, updated once a second. The floor is the segment length: a live
// HLS player must have the segment *after* the one it is showing, so `seg` is the part
// of the delay nobody can remove - the rest is relay buffering plus our buffer.
setInterval(() => {
  if (!hls) return;
  const lvl = hls.levels && hls.levels[hls.currentLevel >= 0 ? hls.currentLevel : 0];
  const seg = (lvl && lvl.details && lvl.details.targetduration) || 0;
  if (typeof hls.latency === 'number' && isFinite(hls.latency)){
    $('#mLat').textContent = hls.latency.toFixed(1) + 's';
    $('#mLat').title = seg
      ? hls.latency.toFixed(1) + 's behind the live edge (segment ' + seg.toFixed(1) + 's)'
      : 'seconds behind the live edge';
  }
}, 1000);

setInterval(() => {
  if (CUR >= 0 && FLAT[CUR]) setNowProg(FLAT[CUR].name);
}, 60000);

$('#qmode').onclick = () => {
  QMODE = (QMODE === 'max') ? 'auto' : 'max';
  applyQuality();
};

// AC-3 / E-AC-3 / MP2 have no browser decoder: the picture plays and the sound does
// not. Show it up front instead of letting the viewer wonder.
function audioBadge(ch, codecs, trackCount){
  const c = ((codecs || '') + ' ' + (ch.audio || '')).toLowerCase();
  const el = $('#mAudio');
  let text = ch.audio || '?', cls = '';
  if (/no audio|none/.test(c)) { text = 'no audio'; cls = 'bad'; }
  else if (/ac-?3|ec-?3|mp2|mp1|dts|truehd/.test(c)) { text = (ch.audio && ch.audio !== '?') ? ch.audio + ' - VLC' : 'AC-3 - VLC'; cls = 'warn'; }
  else if (/mp4a|aac/.test(c)) { text = 'AAC'; }
  else if (trackCount === 0) { text = 'no audio'; cls = 'bad'; }
  else if (trackCount > 0) { text = ch.audio || 'audio'; }
  el.textContent = text;
  el.className = 'pill' + (cls ? ' ' + cls : '');
}

// ---------------------------------------------------------------- captions (CC)
// HLS feeds often ship WebVTT subtitle renditions and hls.js shows them by default,
// with no way to turn them off - which is how a BBC bulletin ends up buried under
// 80px text. The CC button cycles off / track 1 / track 2 ... and the ::cue rule in
// the stylesheet pins the size, so the browser cannot blow it up to fill the frame.
let CCSTATE = (() => { const v = localStorage.getItem('tvapp.cc'); return v === null ? -1 : parseInt(v, 10); })();
if (!Number.isFinite(CCSTATE)) CCSTATE = -1;

function ccTracks(){
  return (hls && hls.subtitleTracks) ? hls.subtitleTracks : [];
}

function applyCC(){
  const btn = $('#ccBtn');
  const tracks = ccTracks();
  if (!tracks.length){
    btn.disabled = true; btn.classList.remove('on'); btn.textContent = 'CC';
    if (hls){ hls.subtitleDisplay = false; hls.subtitleTrack = -1; }
    return;
  }
  btn.disabled = false;
  if (CCSTATE >= tracks.length) CCSTATE = -1;
  if (hls){
    hls.subtitleDisplay = CCSTATE >= 0;
    hls.subtitleTrack = CCSTATE;
  }
  btn.classList.toggle('on', CCSTATE >= 0);
  btn.textContent = CCSTATE >= 0 ? 'CC ' + (CCSTATE + 1) : 'CC';
  const name = CCSTATE >= 0 ? (tracks[CCSTATE].name || tracks[CCSTATE].lang || 'track ' + (CCSTATE + 1)) : '';
  btn.title = CCSTATE >= 0 ? 'captions on: ' + name + ' (C to change)' : 'captions off (C to turn on)';
}

$('#ccBtn').onclick = () => {
  const n = ccTracks().length;
  if (!n) return;
  CCSTATE = (CCSTATE + 1 >= n) ? -1 : CCSTATE + 1;
  localStorage.setItem('tvapp.cc', String(CCSTATE));
  applyCC();
};

// ---------------------------------------------------------------- TV guide
// Listings come from XMLTV indexes the server builds in the background (epg.py).
// Coverage is partial by nature: relay-only channels and FAST feeds often have no
// schedule at all, so a row without a listing simply shows nothing extra.
let GUIDE = null, guideTimer = null;

function fmtTime(ts){
  try { return new Date(ts * 1000).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }); }
  catch (e) { return ''; }
}

const EPG_WIN_MIN = 240;        // 4 hours on screen
const EPG_PX_PER_MIN = 5;       // 1 h = 300 px

function epgStart(){
  const now = Math.floor(Date.now() / 1000);
  return Math.floor(now / 1800) * 1800 - 1800;   // one 30-min slot of context on the left
}

function escHtml(s){
  return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

async function loadGuide(){
  try {
    const r = await fetch('/api/epg?full=1', { cache: 'no-store' });
    const j = await r.json();
    GUIDE = j.channels || {};
  } catch (e){ GUIDE = GUIDE || {}; }
  renderGuide();
  if (CUR >= 0 && FLAT[CUR]) setNowProg(FLAT[CUR].name);
}

function renderGuide(){
  const box = $('#gList');
  if (!GUIDE){ box.innerHTML = '<div class="erow grp"><div class="ecell">loading listings…</div></div>'; return; }

  const start = epgStart(), end = start + EPG_WIN_MIN * 60;
  const x = t => (t - start) / 60 * EPG_PX_PER_MIN;
  const trackW = EPG_WIN_MIN * EPG_PX_PER_MIN;
  const now = Date.now() / 1000;
  let html = '';

  html += '<div class="erow ehead"><div class="ecell">Channel</div>' +
          '<div class="etrack" style="width:' + trackW + 'px">';
  for (let t = start; t < end; t += 1800){
    const onHour = new Date(t * 1000).getMinutes() === 0;
    html += '<div class="etick' + (onHour ? ' hour' : '') + '" style="left:' + x(t) + 'px">' +
            fmtTime(t) + '</div>';
  }
  html += '</div></div>';

  DATA.groups.forEach(g => {
    html += '<div class="erow grp"><div class="ecell">' + escHtml(g.name) + ' &nbsp;·&nbsp; ' + g.channels.length +
            '</div><div class="etrack" style="width:' + trackW + 'px"></div></div>';
    g.channels.forEach(c => {
      const e = GUIDE[c.name];
      const idx = FLAT.indexOf(c);
      const initial = ((c.name.replace(/[^A-Za-z0-9\u4e00-\u9fff]/g, '') || '?')[0] || '?').toUpperCase();
      let blocks = '';
      if (e && e.progs){
        e.progs.forEach(p => {
          if (p[1] <= start || p[0] >= end) return;
          const a = Math.max(p[0], start), b = Math.min(p[1], end);
          const left = x(a) + 1;
          const width = Math.max(26, (b - a) / 60 * EPG_PX_PER_MIN - 2);
          const cls = (p[0] <= now && now < p[1]) ? 'eblock now' : 'eblock';
          blocks += '<div class="' + cls + '" style="left:' + left + 'px;width:' + width + 'px" data-i="' + idx + '">' +
                    '<div class="t">' + escHtml(p[2]) + '</div>' +
                    '<div class="s">' + fmtTime(p[0]) + ' – ' + fmtTime(p[1]) + '</div></div>';
        });
      }
      html += '<div class="erow">' +
              '<div class="ecell"><div class="glogo">' + initial + '</div>' +
              '<div><div class="n">' + escHtml(c.name) + '</div>' +
              '<div class="b">' + (e ? e.src : 'no listings') + '</div></div></div>' +
              '<div class="etrack" style="width:' + trackW + 'px">' +
              (blocks || '<div class="none">no listings</div>') + '</div></div>';
    });
  });

  html += '<div class="nowline" style="left:calc(var(--chw) + ' + x(now) + 'px)"></div>';

  box.innerHTML = html;
  box.querySelectorAll('.eblock').forEach(el => {
    el.onclick = () => {
      const i = +el.dataset.i;
      if (i >= 0){ play(i); closeGuide(); }
    };
  });
  $('#gInfo').textContent = new Date().toLocaleDateString([], { weekday: 'short', day: 'numeric', month: 'short' }) +
                            ' · ' + Object.keys(GUIDE).length + ' channels with listings';

  const sc = $('#gScroll');
  if (sc && !sc.dataset.parked){ sc.scrollLeft = Math.max(0, x(now) - 150); sc.dataset.parked = '1'; }
}

function openGuide(){
  $('#guide').classList.add('show');
  loadGuide();
  if (!guideTimer) guideTimer = setInterval(loadGuide, 300000);
}
function closeGuide(){
  $('#guide').classList.remove('show');
  if (guideTimer){ clearInterval(guideTimer); guideTimer = null; }
}

function setNowProg(name){
  const e = GUIDE && GUIDE[name];
  $('#nowProg').textContent = (e && e.now) ? '· ' + e.now.title : '';
}

$('#guideBtn').onclick = () => {
  if ($('#guide').classList.contains('show')) closeGuide(); else openGuide();
};
$('#guideTop').onclick = () => $('#guideBtn').click();
$('#gClose').onclick = closeGuide;
$('#gNow').onclick = () => {
  const sc = $('#gScroll');
  if (!sc) return;
  const start = epgStart();
  sc.scrollLeft = Math.max(0, (Date.now() / 1000 - start) / 60 * EPG_PX_PER_MIN - 150);
};

function play(i){
  const ch = FLAT[i]; if (!ch) return;
  CUR = i; tries = 0; markActive();
  $('#nowTitle').textContent = ch.name;
  setNowProg(ch.name);
  $('#nowNote').textContent = ch.note || '';
  $('#mRes').textContent = (ch.quality || '').split(' ')[0] || '-';
  const bwm = (ch.quality || '').match(/([\d.]+ Mbps)/);
  $('#mRate').textContent = bwm ? bwm[1] : '-';
  $('#mLive').textContent = 'connecting';
  audioBadge(ch, '', -1);
  const src = '/proxy?u=' + encodeURIComponent(ch.url) + (ch.referer ? '&r=' + encodeURIComponent(ch.referer) : '');
  const v = $('#v');
  hideOverlay();
  if (hls){ hls.destroy(); hls = null; }
  v.classList.remove('idle');
  v.removeAttribute('src'); v.load();

  if (window.Hls && Hls.isSupported()){
    hls = new Hls({ lowLatencyMode: true, maxBufferLength: 6, backBufferLength: 4,
                    liveSyncDurationCount: 1, liveMaxLatencyDurationCount: 2,
                    maxLiveSyncPlaybackRate: 1.5, capLevelToPlayerSize: false,
                    manifestLoadingTimeOut: 15000, fragLoadingMaxRetry: 6,
                    enableWebVTT: true, defaultAudioCodec: 'mp4a.40.2' });
    hls.loadSource(src);
    hls.attachMedia(v);
    if (Hls.Events.SUBTITLE_TRACKS_UPDATED){
      hls.on(Hls.Events.SUBTITLE_TRACKS_UPDATED, () => applyCC());
    }
    hls.on(Hls.Events.MANIFEST_PARSED, () => {
      v.play().catch(() => {});
      $('#mLive').textContent = 'live';
      const L = hls.levels.reduce((a, b) => (b.height > ((a && a.height) || 0) ? b : a), null);
      if (hls.levels.length > 1){
        // Pluto/FAST masters often omit RESOLUTION - fall back to bitrate
        let bi = 0;
        hls.levels.forEach((l, i) => {
          const a = hls.levels[bi];
          const better = (l.height || 0) > (a.height || 0) ||
                         ((l.height || 0) === (a.height || 0) && (l.bitrate || 0) > (a.bitrate || 0));
          if (better) bi = i;
        });
        hls.startLevel = bi;
      }
      applyQuality();
      // prefer a browser-decodable audio rendition (skip AC-3/E-AC-3)
      if (hls.audioTracks && hls.audioTracks.length > 1){
        const i = hls.audioTracks.findIndex(t => !/ac-?3|ec-?3/i.test((t.name || '') + (t.lang || '')));
        if (i >= 0) hls.audioTrack = i;
      }
      const codecs = (hls.levels[0] && hls.levels[0].attrs && hls.levels[0].attrs.CODECS) || '';
      audioBadge(ch, codecs, hls.audioTracks ? hls.audioTracks.length : 0);
      applyCC();
      if (L && L.height){ $('#mRes').textContent = L.width + 'x' + L.height; $('#mRate').textContent = (L.bitrate / 1e6).toFixed(2) + ' Mbps'; }
    });
    v.addEventListener('loadedmetadata', function once(){
      if (v.videoWidth) $('#mRes').textContent = v.videoWidth + 'x' + v.videoHeight;
      // shrink-wrap the element to the picture so captions sit on the image,
      // not in the black bar underneath it
      if (v.videoWidth && v.videoHeight) v.style.aspectRatio = v.videoWidth + ' / ' + v.videoHeight;
      v.removeEventListener('loadedmetadata', once);
    });
    hls.on(Hls.Events.LEVEL_SWITCHED, (_, d) => {
      const L = hls.levels[d.level]; if (!L || !L.height) return;
      $('#mRes').textContent = L.width + 'x' + L.height;
      $('#mRate').textContent = (L.bitrate / 1e6).toFixed(2) + ' Mbps';
      // anything below the top variant gets corrected immediately
      if (QMODE === 'max'){
        const bi = bestLevel();
        if (bi >= 0 && d.level !== bi) hls.currentLevel = bi;
      }
    });
    hls.on(Hls.Events.ERROR, (_, d) => {
      if (!d.fatal) return;
      if (tries++ < 3){ setTimeout(() => play(CUR), 1200 * tries); return; }
      $('#mLive').textContent = 'error';
      overlay('Stream failed', d.details + ' - feed may be offline or geo-blocked. Try the next channel.');
    });
  } else if (v.canPlayType('application/vnd.apple.mpegurl')){
    v.src = src; v.play().catch(() => {});
    $('#mLive').textContent = 'live';
  } else {
    overlay('HLS not supported', 'This browser cannot play HLS.');
  }
}

$('#vlc').onclick = () => {
  const ch = FLAT[CUR]; if (!ch) return;
  fetch('/open?u=' + encodeURIComponent(ch.url) + (ch.referer ? '&r=' + encodeURIComponent(ch.referer) : ''))
    .then(r => r.json()).then(j => { if (!j.ok) alert('VLC launch failed: ' + (j.error || 'unknown')); })
    .catch(() => alert('VLC launch failed'));
};
$('#retry').onclick = () => { if (CUR >= 0) play(CUR); };
$('#fs').onclick = () => { const s = $('#stage'); if (document.fullscreenElement) document.exitFullscreen(); else s.requestFullscreen(); };
// the browser's own video-fullscreen path ignores the page layout and can stretch a
// non-16:9 feed: whenever it happens, drop out of it and fullscreen the stage instead.
document.addEventListener('fullscreenchange', () => {
  const v = document.querySelector('#v');
  if (document.fullscreenElement && document.fullscreenElement === v) {
    document.exitFullscreen().then(() => $('#stage').requestFullscreen()).catch(() => {});
  }
});
['webkitbeginfullscreen', 'webkitendfullscreen'].forEach(ev => {
  document.querySelector('#v').addEventListener(ev, e => {
    if (ev === 'webkitbeginfullscreen') {
      e.target.webkitExitFullscreen && e.target.webkitExitFullscreen();
      $('#stage').requestFullscreen().catch(() => {});
    }
  });
});
$('#q').oninput = rebuild;
$('#addBtn').onclick = () => $('#addbar').classList.toggle('show');
$('#addGo').onclick = () => {
  const u = $('#addUrl').value.trim(); if (!u) return;
  custom.push({ name: 'Custom ' + (custom.length + 1), badge: 'URL', quality: '-', url: u, note: u });
  localStorage.setItem(KEY, JSON.stringify(custom));
  $('#addUrl').value = ''; $('#addbar').classList.remove('show'); rebuild();
};
$('#addUrl').addEventListener('keydown', e => { if (e.key === 'Enter') $('#addGo').click(); });

$('#checkAll').onclick = async () => {
  const dots = [...document.querySelectorAll('.st')];
  for (const d of dots){ d.className = 'st wait'; d.title = 'checking'; }
  await Promise.all(FLAT.map(async (c, i) => {
    const d = document.querySelector('.st[data-st="' + i + '"]'); if (!d) return;
    try {
      const r = await fetch('/api/probe?u=' + encodeURIComponent(c.url));
      const j = await r.json();
      d.className = 'st ' + (j.ok ? 'ok' : 'bad');
      d.title = j.ok ? 'live' : ('dead: ' + (j.status || j.error || '?'));
    } catch (e) { d.className = 'st bad'; }
  }));
};

addEventListener('keydown', e => {
  if (['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;
  if (e.key === 'ArrowDown'){ e.preventDefault(); play(Math.min(CUR + 1, FLAT.length - 1)); }
  if (e.key === 'ArrowUp'){ e.preventDefault(); play(Math.max(CUR - 1, 0)); }
  if (e.key === 'f') $('#fs').click();
  if (e.key === 'm') $('#v').muted = !$('#v').muted;
  if (e.key === 'c'){ $('#ccBtn').click(); }
  if (e.key === 'g'){ $('#guideBtn').click(); }
  if (e.key === 'a'){ $('#qmode').click(); }
  if (e.key === 'r' && CUR >= 0) play(CUR);
});

boot();
if ('serviceWorker' in navigator){ navigator.serviceWorker.register('/sw.js').catch(() => {}); }
</script>
</body>
