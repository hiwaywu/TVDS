<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b0d10">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon-512.png">
<link rel="apple-touch-icon" href="/icon-512.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>tvapp - live channels</title>
<style>
  :root{
    --bg:#06090d; --panel:#0b1117; --panel2:#111922; --panel3:#18222d;
    --line:#1a242f; --line2:#26333f;
    --txt:#e9eff7; --dim:#93a4b8; --dim2:#5f7284;
    --acc:#4cc2ff; --ok:#3ddc84; --warn:#ffb02e; --bad:#ff6b6b;
    --chw:224px;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--txt);font:14px/1.45 "Segoe UI Variable","Segoe UI",system-ui,sans-serif;
    overflow:hidden;-webkit-font-smoothing:antialiased}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:#22303f;border-radius:6px;border:2px solid var(--bg)}
  ::-webkit-scrollbar-thumb:hover{background:#2e4053}
  input[type=search],input[type=text]{
    background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:9px;
    padding:8px 11px;font-size:12.5px;outline:none;transition:.15s}
  input::placeholder{color:var(--dim2)}
  input:focus{border-color:#2f6a8a;background:#0d1720;box-shadow:0 0 0 3px rgba(76,194,255,.08)}
  button{background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:9px;
    padding:7px 11px;font-size:12px;cursor:pointer;white-space:nowrap;transition:.15s;font-weight:500;
    font-family:inherit}
  button:hover{border-color:var(--line2);background:var(--panel3);color:#fff}
  button:active{transform:translateY(1px)}
  button.ghost{background:rgba(12,18,25,.72);backdrop-filter:blur(6px)}
  .pill{background:#0f1720;border:1px solid var(--line);border-radius:7px;padding:4px 8px;
    font-variant-numeric:tabular-nums;font-size:11px;color:var(--dim);white-space:nowrap}
  .pill.warn{color:var(--warn);border-color:#4a3612;background:#1a1508}
  .pill.bad{color:var(--bad);border-color:#4a1d1d;background:#1a0b0b}

  /* ============================================================ GUIDE (home) */
  #guide{position:fixed;inset:0;display:flex;flex-direction:column;background:#080c11;z-index:10}
  body.mode-player #guide{display:none}
  #gHead{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,#0d141b,#0a0f14)}
  #gHead .brand{display:flex;align-items:center;gap:9px;margin-right:6px}
  #gHead .brand b{font-size:15px;letter-spacing:.6px}
  #gHead .dot{width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 12px var(--acc)}
  #count{color:var(--dim2);font-size:11px;font-variant-numeric:tabular-nums}
  #gHead input{width:230px;flex:0 1 230px}
  #gHead .sp{flex:1}
  #gInfo{color:var(--dim2);font-size:12px}
  #addbar{display:none;gap:8px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel2)}
  #addbar.show{display:flex}
  #addbar input{flex:1}
  #gScroll{overflow:auto;flex:1;position:relative}
  .epg{position:relative;width:max-content;min-width:100%}
  .erow{display:flex;align-items:stretch;height:54px;border-bottom:1px solid #0e151c}
  .erow:nth-child(even){background:#090e13}
  .erow.grp{height:30px;background:#0b1218;border-bottom:1px solid var(--line);border-top:1px solid var(--line)}
  .erow.grp .ecell{font-size:9.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim2);font-weight:800}
  .ecell{position:sticky;left:0;z-index:3;width:var(--chw);min-width:var(--chw);background:#0b1117;
    border-right:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 12px}
  .ecell .glogo{width:30px;height:30px;flex:0 0 30px;border-radius:7px;background:#111a22;border:1px solid var(--line);
    color:var(--dim);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
  .ecell .n{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:158px}
  .ecell .b{font-size:9.5px;color:var(--dim2)}
  .ecell .play{display:none;position:absolute;right:8px;top:50%;transform:translateY(-50%);
    color:var(--acc);font-size:9px;letter-spacing:.5px}
  .erow[data-i] .ecell{position:sticky;left:0}
  .erow[data-i]:hover .ecell .play{display:block}
  .etrack{position:relative;flex:0 0 auto}
  .etrack .none{position:absolute;left:10px;top:19px;font-size:11px;color:#3f4f5f;font-style:italic}
  .eblock{position:absolute;top:8px;bottom:8px;border-radius:8px;background:linear-gradient(180deg,#141f2a,#111a23);
    border:1px solid #1c2b38;padding:5px 9px;overflow:hidden;cursor:pointer;color:#cfe0ee;transition:.12s}
  .eblock:hover{background:linear-gradient(180deg,#1a2833,#15212c);border-color:#2e4a61;transform:translateY(-1px);
    box-shadow:0 6px 16px rgba(0,0,0,.35)}
  .eblock.now{background:linear-gradient(180deg,#123024,#0d2419);border-color:#256b42;color:#dbffe9}
  .eblock.now:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--ok);border-radius:8px 0 0 8px}
  .eblock .t{font-size:11.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .eblock .s{font-size:10px;color:#7d93a8;margin-top:1px;font-variant-numeric:tabular-nums}
  .eblock.now .s{color:#8fe0ae}
  .ehead{position:sticky;top:0;z-index:5;background:#0b1117;height:34px;border-bottom:1px solid var(--line)}
  .ehead .ecell{z-index:6;font-size:11px;color:var(--dim2);letter-spacing:1.2px;text-transform:uppercase}
  .etick{position:absolute;top:0;height:100%;border-left:1px solid #16202a;color:var(--dim2);
    font-size:10.5px;padding:9px 0 0 6px;white-space:nowrap;font-variant-numeric:tabular-nums}
  .etick.hour{color:var(--dim);border-left-color:#22303d}
  .nowline{position:absolute;top:0;bottom:0;width:2px;background:var(--acc);opacity:.9;z-index:2;
    box-shadow:0 0 12px rgba(76,194,255,.55);pointer-events:none}
  .nowline:before{content:"";position:absolute;top:0;left:-4px;width:10px;height:10px;border-radius:50%;background:var(--acc)}
  .erow.dead{opacity:.38}
  .erow.dead .n{text-decoration:line-through;text-decoration-color:#6b2b2b}
  .erow.dead .b{color:var(--bad)}
  .erow.cur{background:#0e1a24}
  .erow[data-i]{cursor:pointer}
  .erow[data-i]:hover{background:#0f1c26}
  .erow[data-i]:hover .ecell{background:#111e28}
  .erow[data-i]:hover .ecell .glogo{color:var(--acc);border-color:#2c4a5e}
  .ecell{box-shadow:10px 0 14px -10px rgba(0,0,0,.85)}
  .eblock.clip{border-top-left-radius:0;border-bottom-left-radius:0;padding-left:12px}
  #hideDead.on{color:var(--ok);border-color:#22422f;background:#0d1a13}
  .qgroup{padding:12px 10px 5px;font-size:9.5px;letter-spacing:1.4px;text-transform:uppercase;
    color:var(--dim2);font-weight:800}
  /* per-channel guide sync popover */
  #syncPop{position:absolute;right:18px;bottom:64px;z-index:6;display:none;width:290px;
    background:rgba(10,15,21,.98);border:1px solid var(--line2);border-radius:12px;padding:12px;
    box-shadow:0 18px 40px rgba(0,0,0,.6);backdrop-filter:blur(8px)}
  #syncPop.show{display:block}
  #syncPop .sh{font-size:11.5px;color:var(--dim);margin-bottom:10px;display:flex;gap:6px;
    align-items:baseline;flex-wrap:wrap}
  #syncPop .sh b{color:var(--txt);font-weight:600}
  #syncVal{color:var(--acc);font-variant-numeric:tabular-nums}
  #syncPop .sb{display:flex;gap:6px;margin-top:6px}
  #syncPop .sb button{flex:1;font-size:11.5px;padding:6px 4px}

  /* ============================================================ PLAYER */
  #stage{position:fixed;inset:0;display:none;align-items:center;justify-content:center;
    background:#000;z-index:20}
  body.mode-player #stage{display:flex}
  video{width:auto;height:auto;max-width:100%;max-height:100%;object-fit:contain !important;
    object-position:center;background:#000}
  video::cue{background:rgba(0,0,0,.66);color:#fff;font-size:20px;line-height:1.32;
    font-family:inherit;text-shadow:0 1px 2px #000}
  #stage:fullscreen video::cue{font-size:30px}

  .pctl{position:absolute;left:0;right:0;z-index:3;display:flex;align-items:center;gap:10px;
    transition:opacity .25s,transform .25s;opacity:1}
  .pctl.hide{opacity:0;pointer-events:none}
  #pTop{top:0;padding:14px 18px;background:linear-gradient(180deg,rgba(4,7,10,.92),rgba(4,7,10,0))}
  #pTop.hide{transform:translateY(-8px)}
  #pBottom{bottom:0;padding:16px 18px 14px;background:linear-gradient(0deg,rgba(4,7,10,.95),rgba(4,7,10,0));
    flex-wrap:wrap}
  .pinfo{display:flex;align-items:baseline;gap:10px;min-width:0}
  .pinfo b{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:34ch}
  #nowProg{color:var(--acc);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #meta{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
  #nowNote{color:var(--dim2);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    flex:1;min-width:60px;font-variant-numeric:tabular-nums}
  #pBtns{display:flex;gap:7px;align-items:center;margin-left:auto}
  #qmode{min-width:58px;font-weight:800;letter-spacing:.4px;color:var(--ok);border-color:#22422f;background:#0d1a13}
  #qmode.auto{color:var(--warn);border-color:#4a3612;background:#1a1508}
  #ccBtn{min-width:46px;font-weight:700}
  #ccBtn.on{color:var(--ok);border-color:#22422f;background:#0d1a13}
  #ccBtn:disabled{opacity:.35;cursor:default}
  #overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;
    gap:12px;background:rgba(4,6,9,.9);text-align:center;padding:24px;z-index:4}
  #overlay.show{display:flex}
  #overlay h2{margin:0;font-size:18px}
  #overlay p{margin:0;color:var(--dim);max-width:520px;font-size:12.5px}

  /* quick channel list inside the player */
  #qdrawer{position:absolute;top:0;right:0;bottom:0;width:380px;max-width:82vw;z-index:5;
    background:rgba(8,12,17,.97);border-left:1px solid var(--line);display:none;flex-direction:column;
    backdrop-filter:blur(8px);box-shadow:-20px 0 40px rgba(0,0,0,.45)}
  #qdrawer.show{display:flex}
  .qhead{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);
    font-size:12px;color:var(--dim)}
  .qhead b{color:var(--txt);font-size:14px}
  .qhead .sp{flex:1}
  #qList{overflow:auto;flex:1;padding:6px 8px 16px}
  .qrow{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;cursor:pointer;
    border:1px solid transparent}
  .qrow:hover{background:var(--panel2)}
  .qrow.on{background:#111c25;border-color:#1f3b4d}
  .qrow .qlogo{width:28px;height:28px;flex:0 0 28px;border-radius:6px;background:#111a22;border:1px solid var(--line);
    color:var(--dim);font-size:10.5px;font-weight:700;display:flex;align-items:center;justify-content:center}
  .qrow .qn{flex:1;min-width:0}
  .qrow .qn div:first-child{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .qrow .qn div:last-child{font-size:10.5px;color:var(--dim2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
</head>
<body class="mode-guide">

<!-- ======================================================== TV GUIDE (home) -->
<div id="guide">
  <div id="gHead">
    <div class="brand"><span class="dot"></span><b>tvapp</b><span id="count"></span></div>
    <input id="q" type="search" placeholder="filter channels…" autocomplete="off">
    <button id="checkAll" title="probe every channel now (takes ~20 s)">Check</button>
    <button id="hideDead" title="hide channels that failed the last check">Hide offline</button>
    <button id="addBtn" title="add a stream URL">+</button>
    <span class="sp"></span>
    <span id="gInfo"></span>
    <button id="gNow" title="jump back to now">Now</button>
  </div>
  <div id="addbar">
    <input id="addUrl" type="text" placeholder="https://.../index.m3u8">
    <button id="addGo">Add</button>
  </div>
  <div id="gScroll"><div class="epg" id="gList"></div></div>
</div>

<!-- ======================================================== PLAYER -->
<div id="stage">
  <video id="v" playsinline controlslist="nodownload nofullscreen" disablepictureinpicture></video>

  <div id="pTop" class="pctl">
    <button id="pBack" class="ghost" title="back to the guide (Esc / mouse back)">‹ Guide</button>
    <div class="pinfo"><b id="nowTitle">—</b><span id="nowProg"></span></div>
    <span class="sp"></span>
  </div>

  <div id="pBottom" class="pctl">
    <button id="pPrev" class="ghost" title="previous channel (↑)">‹ Prev</button>
    <button id="pNext" class="ghost" title="next channel (↓)">Next ›</button>
    <div id="meta">
      <span class="pill" id="mRes">-</span>
      <span class="pill" id="mRate">-</span>
      <span class="pill" id="mAudio" title="audio codec">-</span>
      <span class="pill" id="mLive">-</span>
      <span class="pill" id="mLat" title="behind the live edge">-</span>
    </div>
    <span id="nowNote"></span>
    <div id="pBtns">
      <button id="pSync" title="this channel's guide timing is off — nudge it">⏱ Sync</button>
      <button id="pList" title="channel list (L)">☰ List</button>
      <button id="ccBtn" title="captions (C)">CC</button>
      <button id="qmode" title="MAX = highest variant, AUTO = adapt">MAX</button>
      <button id="vlc" title="open this stream in VLC">VLC</button>
      <button id="fs" title="fullscreen (F)">⛶</button>
    </div>
  </div>

  <div id="overlay"><h2 id="ovTitle">Nothing playing</h2><p id="ovText"></p><button id="retry">Retry</button></div>

  <div id="syncPop">
    <div class="sh">Guide timing · <b id="syncName"></b><span id="syncVal"></span></div>
    <div class="sb">
      <button data-d="-30">−30 min</button>
      <button data-d="30">+30 min</button>
      <button data-d="-60">−1 hour</button>
      <button data-d="60">+1 hour</button>
    </div>
    <div class="sb">
      <button data-d="off">Hide these listings</button>
      <button data-d="clear">Reset</button>
    </div>
  </div>

  <div id="qdrawer">
    <div class="qhead"><b>Channels</b><span id="qInfo"></span><span class="sp"></span>
      <button id="qClose">Close</button></div>
    <div id="qList"></div>
  </div>
</div>

<script src="/hls.min.js"></script>
<script>
const $ = s => document.querySelector(s);
let DATA = { groups: [] }, FLAT = [], CUR = -1, hls = null, tries = 0, custom = [];

const KEY = 'tvapp.custom.v1';
try { custom = JSON.parse(localStorage.getItem(KEY) || '[]'); } catch (e) { custom = []; }

let COLLAPSED = new Set(JSON.parse(localStorage.getItem('tvapp.collapsed') || '[]'));

async function boot(){
  const r = await fetch('/api/channels');
  DATA = await r.json();
  history.replaceState({ v: 'guide' }, '', '#guide');   // the guide is the root view
  rebuild();
  loadGuide();
  $('#v').classList.add('idle');
  const q = new URLSearchParams(location.search);
  if (q.has('cc')){
    const c = parseInt(q.get('cc'), 10);
    CCSTATE = Number.isFinite(c) ? c : 0;      // ?cc=0 forces the first caption track on
  }
  if (q.has('ch')){
    const i = parseInt(q.get('ch'), 10);
    if (!isNaN(i) && FLAT[i]){ $('#v').muted = true; openPlayer(i); }
  }
}

function visibleGroups(){
  const q = ($('#q').value || '').toLowerCase().trim();
  const hideDead = localStorage.getItem('tvapp.hidedead') === '1';
  const keep = c => (!q || c.name.toLowerCase().includes(q)) && !(hideDead && c.status === 'dead');
  const out = DATA.groups.map(g => ({ name: g.name, chans: g.channels.filter(keep) })).filter(g => g.chans.length);
  if (custom.length){
    const cs = custom.filter(keep);
    if (cs.length) out.push({ name: 'Custom', chans: cs });
  }
  return out;
}

function rebuild(){
  const gs = visibleGroups();
  FLAT = [].concat.apply([], gs.map(g => g.chans));
  $('#count').textContent = FLAT.length + ' ch';
  renderGuide(gs);
}

function markActive(){
  document.querySelectorAll('.qrow').forEach(el => el.classList.toggle('on', +el.dataset.i === CUR));
  document.querySelectorAll('.erow[data-i]').forEach(el => el.classList.toggle('cur', +el.dataset.i === CUR));
}
function overlay(title, text){
  $('#ovTitle').textContent = title; $('#ovText').textContent = text || '';
  $('#overlay').classList.add('show');
}
function hideOverlay(){ $('#overlay').classList.remove('show'); }

// ---- quality: always the highest variant, ABR downswitching disabled ----
// hls.js still reports switch attempts; we re-pin on every level change.
let QMODE = 'max';   // press "a" in the player to allow AUTO for one channel

function bestLevel(){
  if (!hls || !hls.levels.length) return -1;
  let bi = 0;
  hls.levels.forEach((l, i) => {
    const a = hls.levels[bi];
    const better = (l.height || 0) > (a.height || 0) ||
                   ((l.height || 0) === (a.height || 0) && (l.bitrate || 0) > (a.bitrate || 0));
    if (better) bi = i;
  });
  return bi;
}
function applyQuality(){
  const b = $('#qmode');
  if (b){ b.textContent = QMODE === 'max' ? 'MAX' : 'AUTO'; b.classList.toggle('auto', QMODE !== 'max'); }
  if (!hls) return;
  const bi = bestLevel();
  if (bi < 0) return;
  if (QMODE === 'max') hls.currentLevel = bi;  // pin the top variant
  else hls.currentLevel = -1;                  // ABR takes over
}

// live-edge distance, updated once a second. The floor is the segment length: a live
// HLS player must have the segment *after* the one it is showing, so `seg` is the part
// of the delay nobody can remove - the rest is relay buffering plus our buffer.
setInterval(() => {
  if (!hls) return;
  const lvl = hls.levels && hls.levels[hls.currentLevel >= 0 ? hls.currentLevel : 0];
  const seg = (lvl && lvl.details && lvl.details.targetduration) || 0;
  if (typeof hls.latency === 'number' && isFinite(hls.latency)){
    $('#mLat').textContent = hls.latency.toFixed(1) + 's';
    $('#mLat').title = seg
      ? hls.latency.toFixed(1) + 's behind the live edge (segment ' + seg.toFixed(1) + 's)'
      : 'seconds behind the live edge';
  }
}, 1000);

setInterval(() => {
  if (CUR >= 0 && FLAT[CUR]) setNowProg(FLAT[CUR].name);
}, 60000);

$('#qmode').onclick = () => {
  QMODE = (QMODE === 'max') ? 'auto' : 'max';
  applyQuality();
};

// AC-3 / E-AC-3 / MP2 have no browser decoder: the picture plays and the sound does
// not. Show it up front instead of letting the viewer wonder.
function audioBadge(ch, codecs, trackCount){
  const c = ((codecs || '') + ' ' + (ch.audio || '')).toLowerCase();
  const el = $('#mAudio');
  let text = ch.audio || '?', cls = '';
  if (/no audio|none/.test(c)) { text = 'no audio'; cls = 'bad'; }
  else if (/ac-?3|ec-?3|mp2|mp1|dts|truehd/.test(c)) { text = (ch.audio && ch.audio !== '?') ? ch.audio + ' - VLC' : 'AC-3 - VLC'; cls = 'warn'; }
  else if (/mp4a|aac/.test(c)) { text = 'AAC'; }
  else if (trackCount === 0) { text = 'no audio'; cls = 'bad'; }
  else if (trackCount > 0) { text = ch.audio || 'audio'; }
  el.textContent = text;
  el.className = 'pill' + (cls ? ' ' + cls : '');
}

// ---------------------------------------------------------------- captions (CC)
// HLS feeds often ship WebVTT subtitle renditions and hls.js shows them by default,
// with no way to turn them off - which is how a BBC bulletin ends up buried under
// 80px text. The CC button cycles off / track 1 / track 2 ... and the ::cue rule in
// the stylesheet pins the size, so the browser cannot blow it up to fill the frame.
let CCSTATE = (() => { const v = localStorage.getItem('tvapp.cc'); return v === null ? -1 : parseInt(v, 10); })();
if (!Number.isFinite(CCSTATE)) CCSTATE = -1;

function ccTracks(){
  return (hls && hls.subtitleTracks) ? hls.subtitleTracks : [];
}

function applyCC(){
  const btn = $('#ccBtn');
  const tracks = ccTracks();
  if (!tracks.length){
    btn.disabled = true; btn.classList.remove('on'); btn.textContent = 'CC';
    if (hls){ hls.subtitleDisplay = false; hls.subtitleTrack = -1; }
    return;
  }
  btn.disabled = false;
  if (CCSTATE >= tracks.length) CCSTATE = -1;
  if (hls){
    hls.subtitleDisplay = CCSTATE >= 0;
    hls.subtitleTrack = CCSTATE;
  }
  btn.classList.toggle('on', CCSTATE >= 0);
  btn.textContent = CCSTATE >= 0 ? 'CC ' + (CCSTATE + 1) : 'CC';
  const name = CCSTATE >= 0 ? (tracks[CCSTATE].name || tracks[CCSTATE].lang || 'track ' + (CCSTATE + 1)) : '';
  btn.title = CCSTATE >= 0 ? 'captions on: ' + name + ' (C to change)' : 'captions off (C to turn on)';
}

$('#ccBtn').onclick = () => {
  const n = ccTracks().length;
  if (!n) return;
  CCSTATE = (CCSTATE + 1 >= n) ? -1 : CCSTATE + 1;
  localStorage.setItem('tvapp.cc', String(CCSTATE));
  applyCC();
};

// ---------------------------------------------------------------- TV guide
// Listings come from XMLTV indexes the server builds in the background (epg.py).
// Coverage is partial by nature: relay-only channels and FAST feeds often have no
// schedule at all, so a row without a listing simply shows nothing extra.
let GUIDE = null, guideTimer = null, OFFSETS = {};

function fmtTime(ts){
  try { return new Date(ts * 1000).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }); }
  catch (e) { return ''; }
}

const EPG_WIN_MIN = 240;        // 4 hours on screen
const EPG_PX_PER_MIN = 5;       // 1 h = 300 px

function epgStart(){
  const now = Math.floor(Date.now() / 1000);
  return Math.floor(now / 1800) * 1800 - 1800;   // one 30-min slot of context on the left
}

function escHtml(s){
  return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

async function loadGuide(){
  try {
    const r = await fetch('/api/epg?full=1', { cache: 'no-store' });
    const j = await r.json();
    GUIDE = j.channels || {};
    OFFSETS = j.offsets || {};
  } catch (e){ GUIDE = GUIDE || {}; }
  renderGuide();
  if (CUR >= 0 && FLAT[CUR]) setNowProg(FLAT[CUR].name);
}

// ---- per-channel guide nudge: epg.pw's clock is wrong for some feeds ----
function syncValue(name){
  const v = OFFSETS[name];
  if (v === null) return 'hidden';
  return v ? (v > 0 ? '+' : '') + v + ' min' : 'aligned';
}

$('#pSync').onclick = () => {
  const p = $('#syncPop');
  if (p.classList.contains('show')){ p.classList.remove('show'); return; }
  const ch = FLAT[CUR];
  if (!ch) return;
  $('#syncName').textContent = ch.name;
  $('#syncVal').textContent = syncValue(ch.name);
  p.classList.add('show');
  showCtl();
};

$('#syncPop').querySelectorAll('button[data-d]').forEach(b => {
  b.onclick = async () => {
    const ch = FLAT[CUR];
    if (!ch) return;
    const d = b.dataset.d;
    let value = d;
    if (d !== 'off' && d !== 'clear'){
      value = String(Number(OFFSETS[ch.name] || 0) + Number(d));
    }
    try {
      await fetch('/api/guide-shift?ch=' + encodeURIComponent(ch.name) + '&min=' + encodeURIComponent(value));
    } catch (e){}
    $('#syncPop').classList.remove('show');
    await loadGuide();
    setNowProg(ch.name);
    showCtl();
  };
});

function renderGuide(groups){
  const box = $('#gList');
  const gs = groups || visibleGroups();
  if (!GUIDE){ box.innerHTML = '<div class="erow grp"><div class="ecell">loading listings…</div></div>'; return; }

  const start = epgStart(), end = start + EPG_WIN_MIN * 60;
  const x = t => (t - start) / 60 * EPG_PX_PER_MIN;
  const trackW = EPG_WIN_MIN * EPG_PX_PER_MIN;
  const now = Date.now() / 1000;
  let html = '';

  html += '<div class="erow ehead"><div class="ecell">Channel</div>' +
          '<div class="etrack" style="width:' + trackW + 'px">';
  for (let t = start; t < end; t += 1800){
    const onHour = new Date(t * 1000).getMinutes() === 0;
    html += '<div class="etick' + (onHour ? ' hour' : '') + '" style="left:' + x(t) + 'px">' +
            fmtTime(t) + '</div>';
  }
  html += '</div></div>';

  gs.forEach(g => {
    html += '<div class="erow grp"><div class="ecell">' + escHtml(g.name) + ' &nbsp;·&nbsp; ' + g.chans.length +
            '</div><div class="etrack" style="width:' + trackW + 'px"></div></div>';
    g.chans.forEach(c => {
      const e = GUIDE[c.name];
      const idx = FLAT.indexOf(c);
      const dead = c.status === 'dead';
      const initial = ((c.name.replace(/[^A-Za-z0-9\u4e00-\u9fff]/g, '') || '?')[0] || '?').toUpperCase();
      const sub = dead ? 'offline'
                : (c.status === '?' ? 'unverified'
                : (e ? e.src + ' · ' + e.matched
                     : ((c.badge || '') + ' · ' + (c.note || '').split('|')[1].trim())));
      let blocks = '';
      if (e && e.progs && !dead){
        e.progs.forEach(p => {
          if (p[1] <= start || p[0] >= end) return;
          const a = Math.max(p[0], start), b = Math.min(p[1], end);
          const clipped = p[0] < start;
          const left = x(a) + (clipped ? 0 : 1);
          const width = Math.max(26, (b - a) / 60 * EPG_PX_PER_MIN - 2);
          const cls = (p[0] <= now && now < p[1]) ? 'eblock now' : 'eblock';
          blocks += '<div class="' + cls + (clipped ? ' clip' : '') + '" style="left:' + left + 'px;width:' + width + 'px" data-i="' + idx + '">' +
                    '<div class="t">' + (clipped ? '‹ ' : '') + escHtml(p[2]) + '</div>' +
                    '<div class="s">' + fmtTime(p[0]) + ' – ' + fmtTime(p[1]) + '</div></div>';
        });
      }
      html += '<div class="erow' + (dead ? ' dead' : '') + '" data-i="' + idx + '">' +
              '<div class="ecell"><div class="glogo">' + initial + '</div>' +
              '<div><div class="n">' + escHtml(c.name) + '</div>' +
              '<div class="b">' + escHtml(sub) + '</div></div>' +
              '<span class="play">▶ play</span></div>' +
              '<div class="etrack" style="width:' + trackW + 'px">' +
              (dead ? '<div class="none">offline — press Check to re-test</div>'
                    : (blocks || '<div class="none">no listings</div>')) + '</div></div>';
    });
  });

  html += '<div class="nowline" style="left:calc(var(--chw) + ' + x(now) + 'px)"></div>';

  box.innerHTML = html;
  box.querySelectorAll('.eblock').forEach(el => {
    el.onclick = e => {
      e.stopPropagation();
      const i = +el.dataset.i;
      if (i >= 0) openPlayer(i);
    };
  });
  // the whole row is a play target - the channel cell, the gaps between blocks and the
  // empty track all start that channel, so nothing needs pixel-hunting
  box.querySelectorAll('.erow[data-i]').forEach(el => {
    const i = +el.dataset.i;
    el.onclick = () => { if (i >= 0) openPlayer(i); };
  });
  const offline = DATA.groups.reduce((n, g) => n + g.channels.filter(c => c.status === 'dead').length, 0);
  $('#gInfo').textContent = new Date().toLocaleDateString([], { weekday: 'short', day: 'numeric', month: 'short' }) +
                            ' · ' + Object.keys(GUIDE).length + ' with listings' +
                            (offline ? ' · ' + offline + ' offline' : '');

  const sc = $('#gScroll');
  if (sc && !sc.dataset.parked){ sc.scrollLeft = Math.max(0, x(now) - 150); sc.dataset.parked = '1'; }
}

let VIEW = 'guide', hideTimer = null;

function openPlayer(i, push){
  if (i < 0 || i >= FLAT.length) return;
  play(i);
  document.body.classList.add('mode-player');
  document.body.classList.remove('mode-guide');
  VIEW = 'player';
  if (push !== false) history.pushState({ v: 'player', ch: i }, '', '#ch=' + i);
  showCtl();
  buildDrawer();
}

function openGuide(push){
  document.body.classList.remove('mode-player');
  document.body.classList.add('mode-guide');
  VIEW = 'guide';
  $('#qdrawer').classList.remove('show');
  if (push !== false) history.pushState({ v: 'guide' }, '', '#guide');
  loadGuide();
  renderGuide();
}

function back(){
  if (VIEW === 'player') history.back();
}

function showCtl(){
  $('#pTop').classList.remove('hide');
  $('#pBottom').classList.remove('hide');
  clearTimeout(hideTimer);
  hideTimer = setTimeout(() => {
    if (VIEW !== 'player') return;
    if ($('#qdrawer').classList.contains('show')) return;
    if (new URLSearchParams(location.search).has('ctl')) return;   // debug: keep controls
    $('#pTop').classList.add('hide');
    $('#pBottom').classList.add('hide');
  }, 3200);
}

function buildDrawer(){
  const box = $('#qList');
  if (!box) return;
  let html = '';
  visibleGroups().forEach(g => {
    html += '<div class="qgroup">' + escHtml(g.name) + '</div>';
    g.chans.forEach(c => {
      const i = FLAT.indexOf(c);
      const e = GUIDE && GUIDE[c.name];
      const sub = c.status === 'dead' ? 'offline'
                : (e && e.now ? e.now.title : (c.note || ''));
      const initial = ((c.name.replace(/[^A-Za-z0-9\u4e00-\u9fff]/g, '') || '?')[0] || '?').toUpperCase();
      html += '<div class="qrow" data-i="' + i + '">' +
              '<div class="qlogo">' + initial + '</div>' +
              '<div class="qn"><div>' + escHtml(c.name) + '</div><div>' + escHtml(sub) + '</div></div>' +
              '</div>';
    });
  });
  box.innerHTML = html;
  box.querySelectorAll('.qrow').forEach(el => {
    el.onclick = () => {
      const i = +el.dataset.i;
      if (i >= 0) openPlayer(i);
      $('#qdrawer').classList.remove('show');
    };
  });
  $('#qInfo').textContent = FLAT.length + ' channels';
  markActive();
}

function stepChannel(d){
  if (CUR < 0) return;
  const n = Math.max(0, Math.min(FLAT.length - 1, CUR + d));
  if (n !== CUR) openPlayer(n, false);
}

function setNowProg(name){
  const e = GUIDE && GUIDE[name];
  $('#nowProg').textContent = (e && e.now) ? '· ' + e.now.title : '';
}

$('#pBack').onclick = back;
$('#pList').onclick = () => {
  const d = $('#qdrawer');
  d.classList.toggle('show');
  if (d.classList.contains('show')) buildDrawer();
  showCtl();
};
$('#qClose').onclick = () => { $('#qdrawer').classList.remove('show'); showCtl(); };
$('#pPrev').onclick = () => stepChannel(-1);
$('#pNext').onclick = () => stepChannel(1);
$('#stage').addEventListener('mousemove', showCtl);
$('#stage').addEventListener('click', e => {
  const v = $('#v');
  if (e.target === v){
    if (v.paused) v.play().catch(() => {}); else v.pause();
  }
  showCtl();
});

// browser/mouse back button: guide is the only "root", the player is pushed on top of it
addEventListener('popstate', e => {
  const st = e.state || { v: 'guide' };
  if (st.v === 'player' && FLAT[st.ch]) openPlayer(st.ch, false);
  else openGuide(false);
});

$('#gNow').onclick = () => {
  const sc = $('#gScroll');
  if (!sc) return;
  const start = epgStart();
  sc.scrollLeft = Math.max(0, (Date.now() / 1000 - start) / 60 * EPG_PX_PER_MIN - 150);
};

function play(i){
  const ch = FLAT[i]; if (!ch) return;
  CUR = i; tries = 0; markActive();
  $('#nowTitle').textContent = ch.name;
  setNowProg(ch.name);
  $('#nowNote').textContent = ch.note || '';
  $('#mRes').textContent = (ch.quality || '').split(' ')[0] || '-';
  const bwm = (ch.quality || '').match(/([\d.]+ Mbps)/);
  $('#mRate').textContent = bwm ? bwm[1] : '-';
  $('#mLive').textContent = 'connecting';
  audioBadge(ch, '', -1);
  const src = '/proxy?u=' + encodeURIComponent(ch.url) + (ch.referer ? '&r=' + encodeURIComponent(ch.referer) : '');
  const v = $('#v');
  hideOverlay();
  if (hls){ hls.destroy(); hls = null; }
  v.classList.remove('idle');
  v.removeAttribute('src'); v.load();

  if (window.Hls && Hls.isSupported()){
    hls = new Hls({ lowLatencyMode: true, maxBufferLength: 6, backBufferLength: 4,
                    liveSyncDurationCount: 1, liveMaxLatencyDurationCount: 2,
                    maxLiveSyncPlaybackRate: 1.5, capLevelToPlayerSize: false,
                    manifestLoadingTimeOut: 15000, fragLoadingMaxRetry: 6,
                    enableWebVTT: true, defaultAudioCodec: 'mp4a.40.2' });
    hls.loadSource(src);
    hls.attachMedia(v);
    if (Hls.Events.SUBTITLE_TRACKS_UPDATED){
      hls.on(Hls.Events.SUBTITLE_TRACKS_UPDATED, () => applyCC());
    }
    hls.on(Hls.Events.MANIFEST_PARSED, () => {
      v.play().catch(() => {});
      $('#mLive').textContent = 'live';
      const L = hls.levels.reduce((a, b) => (b.height > ((a && a.height) || 0) ? b : a), null);
      if (hls.levels.length > 1){
        // Pluto/FAST masters often omit RESOLUTION - fall back to bitrate
        let bi = 0;
        hls.levels.forEach((l, i) => {
          const a = hls.levels[bi];
          const better = (l.height || 0) > (a.height || 0) ||
                         ((l.height || 0) === (a.height || 0) && (l.bitrate || 0) > (a.bitrate || 0));
          if (better) bi = i;
        });
        hls.startLevel = bi;
      }
      applyQuality();
      // prefer a browser-decodable audio rendition (skip AC-3/E-AC-3)
      if (hls.audioTracks && hls.audioTracks.length > 1){
        const i = hls.audioTracks.findIndex(t => !/ac-?3|ec-?3/i.test((t.name || '') + (t.lang || '')));
        if (i >= 0) hls.audioTrack = i;
      }
      const codecs = (hls.levels[0] && hls.levels[0].attrs && hls.levels[0].attrs.CODECS) || '';
      audioBadge(ch, codecs, hls.audioTracks ? hls.audioTracks.length : 0);
      applyCC();
      if (L && L.height){ $('#mRes').textContent = L.width + 'x' + L.height; $('#mRate').textContent = (L.bitrate / 1e6).toFixed(2) + ' Mbps'; }
    });
    v.addEventListener('loadedmetadata', function once(){
      if (v.videoWidth) $('#mRes').textContent = v.videoWidth + 'x' + v.videoHeight;
      // shrink-wrap the element to the picture so captions sit on the image,
      // not in the black bar underneath it
      if (v.videoWidth && v.videoHeight) v.style.aspectRatio = v.videoWidth + ' / ' + v.videoHeight;
      v.removeEventListener('loadedmetadata', once);
    });
    hls.on(Hls.Events.LEVEL_SWITCHED, (_, d) => {
      const L = hls.levels[d.level]; if (!L || !L.height) return;
      $('#mRes').textContent = L.width + 'x' + L.height;
      $('#mRate').textContent = (L.bitrate / 1e6).toFixed(2) + ' Mbps';
      // anything below the top variant gets corrected immediately
      if (QMODE === 'max'){
        const bi = bestLevel();
        if (bi >= 0 && d.level !== bi) hls.currentLevel = bi;
      }
    });
    hls.on(Hls.Events.ERROR, (_, d) => {
      if (!d.fatal) return;
      if (tries++ < 3){ setTimeout(() => play(CUR), 1200 * tries); return; }
      $('#mLive').textContent = 'error';
      overlay('Stream failed', d.details + ' - feed may be offline or geo-blocked. Try the next channel.');
    });
  } else if (v.canPlayType('application/vnd.apple.mpegurl')){
    v.src = src; v.play().catch(() => {});
    $('#mLive').textContent = 'live';
  } else {
    overlay('HLS not supported', 'This browser cannot play HLS.');
  }
}

$('#vlc').onclick = () => {
  const ch = FLAT[CUR]; if (!ch) return;
  fetch('/open?u=' + encodeURIComponent(ch.url) + (ch.referer ? '&r=' + encodeURIComponent(ch.referer) : ''))
    .then(r => r.json()).then(j => { if (!j.ok) alert('VLC launch failed: ' + (j.error || 'unknown')); })
    .catch(() => alert('VLC launch failed'));
};
$('#retry').onclick = () => { if (CUR >= 0) play(CUR); };
$('#fs').onclick = () => { const s = $('#stage'); if (document.fullscreenElement) document.exitFullscreen(); else s.requestFullscreen(); };
// the browser's own video-fullscreen path ignores the page layout and can stretch a
// non-16:9 feed: whenever it happens, drop out of it and fullscreen the stage instead.
document.addEventListener('fullscreenchange', () => {
  const v = document.querySelector('#v');
  if (document.fullscreenElement && document.fullscreenElement === v) {
    document.exitFullscreen().then(() => $('#stage').requestFullscreen()).catch(() => {});
  }
});
['webkitbeginfullscreen', 'webkitendfullscreen'].forEach(ev => {
  document.querySelector('#v').addEventListener(ev, e => {
    if (ev === 'webkitbeginfullscreen') {
      e.target.webkitExitFullscreen && e.target.webkitExitFullscreen();
      $('#stage').requestFullscreen().catch(() => {});
    }
  });
});
$('#q').oninput = rebuild;

// hide/show the channels that failed the last probe
(function initHideDead(){
  const on = localStorage.getItem('tvapp.hidedead') === '1';
  $('#hideDead').classList.toggle('on', on);
})();
$('#hideDead').onclick = () => {
  const on = localStorage.getItem('tvapp.hidedead') === '1';
  localStorage.setItem('tvapp.hidedead', on ? '0' : '1');
  $('#hideDead').classList.toggle('on', !on);
  rebuild();
};
$('#addBtn').onclick = () => $('#addbar').classList.toggle('show');
$('#addGo').onclick = () => {
  const u = $('#addUrl').value.trim(); if (!u) return;
  custom.push({ name: 'Custom ' + (custom.length + 1), badge: 'URL', quality: '-', url: u, note: u });
  localStorage.setItem(KEY, JSON.stringify(custom));
  $('#addUrl').value = ''; $('#addbar').classList.remove('show'); rebuild();
};
$('#addUrl').addEventListener('keydown', e => { if (e.key === 'Enter') $('#addGo').click(); });

$('#checkAll').onclick = async () => {
  const btn = $('#checkAll');
  btn.disabled = true; btn.textContent = 'checking…';
  let live = 0, dead = 0;
  const queue = FLAT.slice();
  let done = 0;
  const worker = async () => {
    while (queue.length){
      const c = queue.shift();
      try {
        const r = await fetch('/api/probe?u=' + encodeURIComponent(c.url) + (c.referer ? '&r=' + encodeURIComponent(c.referer) : ''));
        const j = await r.json();
        c.status = j.ok ? 'ok' : 'dead';
        c.status_note = j.ok ? '' : (j.status || j.error || '');
        j.ok ? live++ : dead++;
      } catch (e) { c.status = '?'; }
      done++;
      btn.textContent = 'checking ' + done + '/' + FLAT.length;
    }
  };
  await Promise.all([worker(), worker(), worker(), worker(), worker(), worker()]);
  btn.disabled = false; btn.textContent = 'Check';
  renderGuide();
  $('#gInfo').textContent = 'checked just now · ' + live + ' live · ' + dead + ' offline';
};

addEventListener('keydown', e => {
  if (['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;
  const k = e.key;
  if (k === 'Escape' || k === 'Backspace'){ e.preventDefault(); back(); return; }
  if (k === 'g'){ VIEW === 'player' ? back() : null; return; }
  if (k === 'l' && VIEW === 'player'){ $('#pList').click(); return; }
  if (k === 'ArrowDown' && VIEW === 'player'){ e.preventDefault(); stepChannel(1); return; }
  if (k === 'ArrowUp' && VIEW === 'player'){ e.preventDefault(); stepChannel(-1); return; }
  if (k === 'f'){ $('#fs').click(); return; }
  if (k === 'm'){ $('#v').muted = !$('#v').muted; return; }
  if (k === 'c'){ $('#ccBtn').click(); return; }
  if (k === 'a'){ $('#qmode').click(); return; }
  if (k === 'r' && CUR >= 0) play(CUR);
});

boot();
if ('serviceWorker' in navigator){ navigator.serviceWorker.register('/sw.js').catch(() => {}); }
</script>
